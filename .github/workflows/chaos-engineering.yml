name: Chaos Engineering

on:
  schedule:
    # Run chaos experiments weekly on Mondays at 3 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Chaos experiment to run'
        required: true
        type: choice
        options:
          - neon-branch-failover
          - db-pool-exhaustion
          - api-latency-injection
          - db-latency-injection
          - ws-network-partition
          - s3-failure
          - auth-failure
          - redis-failure
          - cpu-stress
          - memory-stress
          - all
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - preview
      duration:
        description: 'Experiment duration in seconds'
        required: false
        type: string
        default: '300'

env:
  NODE_VERSION: "24"
  K6_VERSION: "0.53.0"

jobs:
  chaos:
    name: Chaos Experiment - ${{ github.event.inputs.experiment || 'scheduled' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./tests/chaos

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Configure environment
        run: |
          echo "API_BASE_URL=https://${{ github.event.inputs.environment || 'staging' }}-api.instagram-clone.com" >> $GITHUB_ENV
          echo "WS_BASE_URL=wss://${{ github.event.inputs.environment || 'staging' }}-api.instagram-clone.com/ws/v1" >> $GITHUB_ENV
          echo "TEST_TOKEN=${{ secrets.CHAOS_TEST_TOKEN }}" >> $GITHUB_ENV
          echo "CHAOS_DURATION=${{ github.event.inputs.duration || '300' }}" >> $GITHUB_ENV
          echo "CHAOS_ENV=${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_ENV

      - name: Run Neon Branch Failover Experiment
        if: github.event.inputs.experiment == 'neon-branch-failover' || github.event.inputs.experiment == 'all'
        run: |
          k6 run tests/chaos/neon-branch-failover.js \
            --out json=results/neon-failover-$(date +%s).json
        working-directory: ./

      - name: Run DB Pool Exhaustion Experiment
        if: github.event.inputs.experiment == 'db-pool-exhaustion' || github.event.inputs.experiment == 'all'
        run: |
          k6 run tests/chaos/db-pool-exhaustion.js \
            --out json=results/db-pool-$(date +%s).json
        working-directory: ./

      - name: Run API Latency Injection Experiment
        if: github.event.inputs.experiment == 'api-latency-injection' || github.event.inputs.experiment == 'all'
        run: |
          k6 run tests/chaos/latency-injection.js \
            --env CHAOS_TARGET=api \
            --out json=results/api-latency-$(date +%s).json
        working-directory: ./

      - name: Run DB Latency Injection Experiment
        if: github.event.inputs.experiment == 'db-latency-injection' || github.event.inputs.experiment == 'all'
        run: |
          k6 run tests/chaos/latency-injection.js \
            --env CHAOS_TARGET=db \
            --out json=results/db-latency-$(date +%s).json
        working-directory: ./

      - name: Run WebSocket Network Partition Experiment
        if: github.event.inputs.experiment == 'ws-network-partition' || github.event.inputs.experiment == 'all'
        run: |
          k6 run tests/chaos/ws-network-partition.js \
            --out json=results/ws-partition-$(date +%s).json
        working-directory: ./

      - name: Run S3 Failure Experiment
        if: github.event.inputs.experiment == 's3-failure' || github.event.inputs.experiment == 'all'
        run: |
          k6 run tests/chaos/dependency-failure.js \
            --env CHAOS_DEPENDENCY=s3 \
            --out json=results/s3-failure-$(date +%s).json
        working-directory: ./

      - name: Run Auth Failure Experiment
        if: github.event.inputs.experiment == 'auth-failure' || github.event.inputs.experiment == 'all'
        run: |
          k6 run tests/chaos/dependency-failure.js \
            --env CHAOS_DEPENDENCY=auth \
            --out json=results/auth-failure-$(date +%s).json
        working-directory: ./

      - name: Run Redis Failure Experiment
        if: github.event.inputs.experiment == 'redis-failure' || github.event.inputs.experiment == 'all'
        run: |
          k6 run tests/chaos/dependency-failure.js \
            --env CHAOS_DEPENDENCY=redis \
            --out json=results/redis-failure-$(date +%s).json
        working-directory: ./

      - name: Run CPU Stress Experiment
        if: github.event.inputs.experiment == 'cpu-stress' || github.event.inputs.experiment == 'all'
        run: |
          k6 run tests/chaos/resource-exhaustion.js \
            --env CHAOS_RESOURCE=cpu \
            --out json=results/cpu-stress-$(date +%s).json
        working-directory: ./

      - name: Run Memory Stress Experiment
        if: github.event.inputs.experiment == 'memory-stress' || github.event.inputs.experiment == 'all'
        run: |
          k6 run tests/chaos/resource-exhaustion.js \
            --env CHAOS_RESOURCE=memory \
            --out json=results/memory-stress-$(date +%s).json
        working-directory: ./

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-results-${{ github.event.inputs.experiment || 'scheduled' }}-${{ github.run_id }}
          path: results/
          retention-days: 30

      - name: Analyze results and create summary
        if: always()
        run: |
          echo "## Chaos Engineering Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Experiment**: ${{ github.event.inputs.experiment || 'scheduled' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for file in results/*.json; do
            if [ -f "$file" ]; then
              echo "### $(basename $file)" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat "$file" | jq '.metrics | to_entries | map(select(.value.thresholds)) | from_entries' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#incidents'
          text: "Chaos experiment failed: ${{ github.event.inputs.experiment || 'scheduled' }} on ${{ github.event.inputs.environment || 'staging' }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  notify-complete:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: chaos
    if: always()
    steps:
      - name: Send completion notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.chaos.result }}
          channel: '#chaos-engineering'
          text: "Chaos experiment ${{ github.event.inputs.experiment || 'scheduled' }} completed with status: ${{ needs.chaos.result }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true