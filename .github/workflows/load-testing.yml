name: Load Testing

on:
  schedule:
    # Run full load test weekly on Sundays at 2 AM UTC (after CI)
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Load test scenario'
        required: true
        type: choice
        options:
          - smoke
          - ramp_up
          - spike
          - soak
          - stress
          - all
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - preview

env:
  NODE_VERSION: "24"
  K6_VERSION: "0.53.0"

jobs:
  load-test:
    name: Load Test - ${{ github.event.inputs.scenario || 'scheduled' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./tests/load

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Configure environment
        run: |
          echo "API_BASE_URL=https://${{ github.event.inputs.environment || 'staging' }}-api.instagram-clone.com" >> $GITHUB_ENV
          echo "WS_BASE_URL=wss://${{ github.event.inputs.environment || 'staging' }}-api.instagram-clone.com/ws/v1" >> $GITHUB_ENV
          echo "TEST_TOKEN=${{ secrets.LOAD_TEST_TOKEN }}" >> $GITHUB_ENV
          echo "K6_PROJECT_ID=${{ secrets.K6_PROJECT_ID }}" >> $GITHUB_ENV

      - name: Run Smoke Test
        if: github.event.inputs.scenario == 'smoke' || github.event.inputs.scenario == 'all'
        run: |
          k6 run tests/load/master-load-test.js \
            --vus 10 \
            --duration 30s \
            --out json=results/smoke-$(date +%s).json
        working-directory: ./

      - name: Run Ramp Up Test
        if: github.event.inputs.scenario == 'ramp_up' || github.event.inputs.scenario == 'all'
        run: |
          k6 run tests/load/master-load-test.js \
            --env K6_SCENARIO=ramp_up \
            --out json=results/ramp-up-$(date +%s).json
        working-directory: ./
        timeout-minutes: 35

      - name: Run Spike Test
        if: github.event.inputs.scenario == 'spike' || github.event.inputs.scenario == 'all'
        run: |
          k6 run tests/load/master-load-test.js \
            --env K6_SCENARIO=spike \
            --out json=results/spike-$(date +%s).json
        working-directory: ./
        timeout-minutes: 10

      - name: Run Soak Test
        if: github.event.inputs.scenario == 'soak' || github.event.inputs.scenario == 'all'
        run: |
          k6 run tests/load/master-load-test.js \
            --env K6_SCENARIO=soak \
            --out json=results/soak-$(date +%s).json
        working-directory: ./
        timeout-minutes: 40

      - name: Run Stress Test
        if: github.event.inputs.scenario == 'stress' || github.event.inputs.scenario == 'all'
        run: |
          k6 run tests/load/master-load-test.js \
            --env K6_SCENARIO=stress \
            --out json=results/stress-$(date +%s).json
        working-directory: ./
        timeout-minutes: 15

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ github.event.inputs.scenario || 'scheduled' }}-${{ github.run_id }}
          path: results/
          retention-days: 30

      - name: Generate HTML Report
        if: always()
        run: |
          for file in results/*.json; do
            if [ -f "$file" ]; then
              k6 report "$file" --output "reports/$(basename "$file" .json).html"
            fi
          done
        working-directory: ./

      - name: Upload HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports-${{ github.event.inputs.scenario || 'scheduled' }}-${{ github.run_id }}
          path: reports/
          retention-days: 30

      - name: Check Thresholds
        if: always()
        run: |
          echo "## Load Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scenario**: ${{ github.event.inputs.scenario || 'scheduled' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for file in results/*.json; do
            if [ -f "$file" ]; then
              echo "### $(basename $file)" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat "$file" | jq '.metrics | to_entries | map(select(.value.thresholds)) | from_entries' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#ci-alerts'
          text: "Load test failed: ${{ github.event.inputs.scenario || 'scheduled' }} on ${{ github.event.inputs.environment || 'staging' }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  notify-complete:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: load-test
    if: always()
    steps:
      - name: Send completion notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.load-test.result }}
          channel: '#load-testing'
          text: "Load test ${{ github.event.inputs.scenario || 'scheduled' }} completed with status: ${{ needs.load-test.result }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true